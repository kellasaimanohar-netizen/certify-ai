name: Agent Audit CI — v7

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # daily drift check

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,all]"
      - run: ruff check src/ tests/
      - run: mypy src/agent_audit/ --ignore-missing-imports
        continue-on-error: true
      - run: pytest -v

  framework-validation:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[all]"
      - name: Run full v7 audit (all 17 phases)
        run: |
          agent-audit run \
            --target targets/my_agent_v4.yaml \
            --mode validate \
            --variability-runs 5 \
            --phase all \
            --output report.json \
            --sarif report.sarif \
            --html report.html \
            --cert-output certificate.json
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report.sarif
          category: agent-audit-v7
      - uses: actions/upload-artifact@v4
        with:
          name: audit-report-v7
          path: |
            report.json
            report.sarif
            report.html
            certificate.json

  drift-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[all]"
      - uses: actions/download-artifact@v4
        with:
          name: audit-report-v7
          path: baseline/
        continue-on-error: true
      - name: Drift check
        if: hashFiles('baseline/certificate.json') != ''
        run: |
          agent-audit drift \
            --cert baseline/certificate.json \
            --target targets/my_agent_v4.yaml \
            --variability-runs 10 \
            --mock-tools
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_AUDIT_WEBHOOK }}
